name: Deploy Project
on: push
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      -name: Fetch Code
      uses: actions/checkout@V3
  test:
    runs-on: ubuntu-latest
    steps:
      -name: Install Dependency
      run: npm install 
      -name: Run Test
      run: |
        npm lint
        npm build
        npm test
